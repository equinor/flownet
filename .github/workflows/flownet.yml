name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  release:
    types:
      - published
  schedule:
    # Run CI daily and check that tests are working with latest dependencies
    - cron: "0 0 * * *"

jobs:
  FlowNet:
    runs-on: ${{ matrix.ubuntu-version }}
    strategy:
      matrix:
        include:
          - python-version: "3.12"
            ubuntu-version: ubuntu-24.04
            testdata-model: egg
          - python-version: "3.12"
            ubuntu-version: ubuntu-24.04
            testdata-model: norne
          - python-version: "3.14"
            ubuntu-version: ubuntu-26.04
            testdata-model: egg
          - python-version: "3.14"
            ubuntu-version: ubuntu-26.04
            testdata-model: norne
    env:
      PYTHONWARNINGS: default
    steps:
      - name: 📖 Checkout commit locally
        uses: actions/checkout@v6

      - name: 🐍 Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: setup.py

      - name: 🧪 Create virtual environment
        run: |
          python -m venv "$RUNNER_TEMP/flownet-venv"
          echo "$RUNNER_TEMP/flownet-venv/bin" >> "$GITHUB_PATH"

      - name: 📦 Install non-python dependencies
        run: sudo bash ./apt_install.sh

      - name: 🍿 Download FlowNet test data
        env:
          INPUT_MODEL_FOLDER: ./flownet-testdata/${{ matrix.testdata-model }}/input_model
          # If you want the CI to (temporarily) run against your fork of the testdata,
          # change the value her from "equinor" to your username.
          TESTDATA_REPO_OWNER: equinor
          # If you want the CI to (temporarily) run against another branch than master,
          # change the value her from "master" to the relevant branch name.
          TESTDATA_REPO_BRANCH: master
        run: |
          git clone --depth 1 --branch $TESTDATA_REPO_BRANCH https://github.com/$TESTDATA_REPO_OWNER/flownet-testdata.git --recursive
          for f in $INPUT_MODEL_FOLDER/*.tar.gz; do tar -zxvf "$f" -C $INPUT_MODEL_FOLDER; done

      - name: 📦 Install FlowNet and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[tests]"

      - name: 🚀 Check FlowNet and simulator entry points
        run: |
          flownet --help
          flow --version

      - name: 🧾 List all installed packages
        run: python -m pip freeze

      - name: 🕵️ Check code style & linting
        run: |
          black --check tests/ src/ setup.py
          pylint src/ tests/ setup.py
          mypy --ignore-missing-imports src/ setup.py

      - name: 🤖 Run tests
        run: |
          pytest --cov=flownet --cov-fail-under=29 ./tests

      - name: 🚀 Run reduced Egg integration examples
        if: matrix.testdata-model == 'egg'
        timeout-minutes: 15
        env:
          MLFLOW_ALLOW_FILE_STORE: "true"
        run: |
          cd ./flownet-testdata/egg
          flownet ahm ./config/assisted_history_matching.yml ./ci_ahm_run --update-config ./ci_config/assisted_history_matching.yml
          flownet ahm ./config/assisted_history_matching.yml ./ci_ahm_restart --update-config ./ci_config/assisted_history_matching.yml --restart-folder ./ci_ahm_run
          flownet pred ./config/prediction.yml ./ci_pred_run ./ci_ahm_run --update-config ./ci_config/prediction.yml
          python - <<'PY'
          from pathlib import Path
          import yaml

          config_path = Path("config/hyperparameter.yml")
          config = yaml.safe_load(config_path.read_text(encoding="utf8"))
          config["flownet"]["hyperopt"]["n_runs"] = 1
          config["model_parameters"]["relative_permeability"]["scheme"] = "global"
          Path("config/ci_hyperparameter.yml").write_text(
              yaml.safe_dump(config, sort_keys=False), encoding="utf8"
          )
          PY
          flownet hyperparam ./config/ci_hyperparameter.yml ./ci_hyperparameter_run --update-config ./ci_config/assisted_history_matching.yml

      - name: 🚀 Run reduced Norne integration examples
        if: matrix.testdata-model == 'norne'
        timeout-minutes: 15
        run: |
          cd ./flownet-testdata/norne
          python - <<'PY'
          from pathlib import Path
          import yaml

          config_path = Path("config/assisted_history_matching.yml")
          config = yaml.safe_load(config_path.read_text(encoding="utf8"))
          region = config["model_parameters"]["relative_permeability"]["regions"][0]
          region["swirr"].update(min=0.009, max=0.011)
          region["swl"].update(min=0.049, max=0.051)
          Path("config/ci_assisted_history_matching.yml").write_text(
              yaml.safe_dump(config, sort_keys=False), encoding="utf8"
          )

          prediction = yaml.safe_load(
              Path("ci_config/prediction.yml").read_text(encoding="utf8")
          )
          ert = prediction.setdefault("ert", {})
          ert.setdefault("realizations", {})["num_realizations"] = 2
          ert.setdefault("queue", {})["max_running"] = 2
          Path("ci_config/ci_prediction.yml").write_text(
              yaml.safe_dump(prediction, sort_keys=False), encoding="utf8"
          )

          ahm_update = {
            "flownet": {
              "additional_flow_nodes": [20, 40],
              "additional_node_candidates": 100,
              "max_distance_fraction": 0.05,
              "constraining": {"kriging": {"enabled": False}},
            },
            "ert": {
              "realizations": {
                "num_realizations": 2,
                "required_success_percent": 40,
                "max_runtime": 180,
              },
              "queue": {"max_running": 2},
              "ensemble_weights": [1],
            },
            "model_parameters": {
              "relative_permeability": {"scheme": "global"}
            },
          }
          Path("ci_config/ci_assisted_history_matching.yml").write_text(
            yaml.safe_dump(ahm_update, sort_keys=False), encoding="utf8"
          )
          PY
          flownet ahm ./config/ci_assisted_history_matching.yml ./ci_ahm_run --update-config ./ci_config/ci_assisted_history_matching.yml
          flownet ahm ./config/ci_assisted_history_matching.yml ./ci_ahm_restart --update-config ./ci_config/ci_assisted_history_matching.yml --restart-folder ./ci_ahm_run
          flownet pred ./config/prediction.yml ./ci_pred_run ./ci_ahm_run --update-config ./ci_config/ci_prediction.yml

      - name: 📚 Build documentation
        run: |
          pushd docs
          make html
          popd

      - name: 🚢 Build and deploy Python package
        if: github.event_name == 'release' && matrix.python-version == '3.12' && matrix.testdata-model == 'egg'
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.pypi_flownet_token }}
        run: |
          python -m pip install --upgrade setuptools wheel setuptools-scm twine
          python setup.py bdist_wheel
          twine upload dist/*

      - name: 📚 Update GitHub pages
        if: github.event_name != 'schedule' && github.ref == 'refs/heads/master' && matrix.python-version == '3.12' && matrix.testdata-model == 'egg'
        run: |
          cp -R ./docs/_build ../_build
          git config --local user.email "flownet-github-action"
          git config --local user.name "flownet-github-action"
          if git ls-remote --exit-code --heads origin gh-pages; then
            git fetch origin gh-pages
            git checkout --track origin/gh-pages
          else
            status=$?
            if [ "$status" -ne 2 ]; then
              exit "$status"
            fi
            git checkout --orphan gh-pages
          fi
          git clean -f -f -d -x
          git rm -rf --ignore-unmatch .

          cp -R ../_build/html/* .
          git add .
          if git diff-index --quiet HEAD; then
            echo "No changes in documentation. Skip documentation deploy."
          else
            git commit -m "Update Github Pages"
            git push "https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
          fi
